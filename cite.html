<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Citation Checker · laya lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="hero">
      <h1>Does the source back it up?</h1>
      <p>Give a claim and a source text. Laya checks every sentence of the source against the claim in one batch (supports / contradicts / unrelated) and highlights the evidence. Hover a sentence to see the probabilities.</p>
    </section>
    <div class="split">
      <div class="side">
        <div class="card">
          <label class="field">Claim<textarea id="claim" rows="2"></textarea></label>
          <label class="field" style="margin-top:12px">Source<textarea id="source" rows="10"></textarea></label>
          <div class="row" style="margin-top:12px;justify-content:space-between">
            <div class="samples" id="samples" style="margin:0"></div>
            <button class="btn primary" id="go">Check →</button>
          </div>
        </div>
      </div>
      <div class="side">
        <div class="card"><h2>Verdict</h2><div id="verdict" class="hint">Nothing checked yet.</div></div>
        <div class="card"><h2>Evidence</h2><div id="view" class="source-view hint">–</div></div>
      </div>
    </div>
  </main>
  <script type="module" src="cite.js"></script>
</body>
</html>
